name: Despliegue Backend a Amazon ECR

on:
  push:
    branches: [ "deploy" ]

env:
  AWS_REGION: us-east-1
  # Esta linea de abajo toma el nombre del repo de GitHub automaticamente.
  ECR_REPOSITORY: ${{ github.event.repository.name }} 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto con Maven (Generar JAR)
        run: mvn -B package -DskipTests

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen Docker y subir a la nube
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      # Se define el paso para desplegar en la instancia EC2 mediante AWS Systems Manager (SSM).
      - name: Deploy to EC2 via SSM
        run: |
          # Obtenemos la URL de tu repositorio ECR dinámicamente
          REGISTRY=${{ steps.login-ecr.outputs.registry }}

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-01f6fbf95b17dd8e1" \
            --comment "Se actualiza el microservicio de Despacho en producción" \
            --parameters "commands=[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/$ECR_REPOSITORY:latest\",
              \"docker rm -f msv-despacho || true\",
              \"docker run -d --restart always -p 8082:8081 --name msv-despacho -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} -e DB_PORT=3306 -e DB_NAME=despacho_db -e DB_USERNAME=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} $REGISTRY/$ECR_REPOSITORY:latest\",
              \"docker image prune -f\"
            ]" \
            --region ${{ env.AWS_REGION }}
