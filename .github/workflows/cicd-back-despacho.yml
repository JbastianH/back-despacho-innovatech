name: Despliegue Backend Despachos a EKS

on:
  push:
    branches: [ "deploy" ]

env:
  AWS_REGION: us-east-1
  # Se define el repositorio exacto de ECR creado para este microservicio
  ECR_REPOSITORY: examen-back-despacho
  # Se define el nombre del cluster EKS
  EKS_CLUSTER_NAME: cluster-examen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto con Maven (Generar JAR)
        # Se genera el ejecutable omitiendo las pruebas para agilizar el despliegue
        run: mvn -B package -DskipTests

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen Docker y subir a la nube
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        # Se compila la imagen localmente y se transfiere al registro de ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
      - name: Conectar al Cluster EKS
        # Se actualiza el archivo kubeconfig del entorno de integracion con las credenciales del cluster
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Desplegar en Kubernetes
        # Se asegura la existencia del namespace y se aplican los manifiestos de infraestructura
        run: |
          kubectl create namespace examen --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/despachos-deployment.yaml -n examen
          kubectl apply -f k8s/despachos-service.yaml -n examen
          kubectl apply -f k8s/despachos-hpa.yaml -n examen
          kubectl rollout restart deployment back-despachos-deployment -n examen
