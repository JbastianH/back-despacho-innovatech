apiVersion: apps/v1
kind: Deployment
metadata:
  # Se inicializa el despliegue para el microservicio de logística y despachos
  name: back-despachos-deployment
  namespace: examen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back-despachos
  template:
    metadata:
      labels:
        app: back-despachos
    spec:
      containers:
        - name: back-despachos
          # Se vincula la imagen almacenada en ECR para el backend de despachos
          image: 680891292484.dkr.ecr.us-east-1.amazonaws.com/examen-back-despacho:latest
          imagePullPolicy: Always
          ports:
            # Se expone el puerto estándar del contenedor Spring Boot
            - containerPort: 8080