apiVersion: apps/v1
kind: Deployment
metadata:
  # Se inicializa el despliegue para el microservicio de logística y despachos
  name: back-despachos-deployment
  namespace: examen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back-despachos
  template:
    metadata:
      labels:
        app: back-despachos
    spec:
      containers:
      - name: back-despachos
        # Se vincula la imagen almacenada en ECR para el backend de despachos
        image: 680891292484.dkr.ecr.us-east-1.amazonaws.com/examen-back-despacho:latest
        imagePullPolicy: Always
        ports:
        # Se expone el puerto estándar del contenedor Spring Boot
        - containerPort: 8080
        # Se establece la asignación de recursos mínimos y máximos para posibilitar el cálculo de porcentajes del HPA
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        # BLOQUE ENV PARA EVITAR EL CRASH DE CONEXIÓN:
        env:
        - name: SPRING_AUTOCONFIGURE_EXCLUDE
          value: "org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration"
